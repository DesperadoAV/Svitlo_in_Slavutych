<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/6qXnY1GR/1770893073813.png">
    <title>Світло Славутич</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        /* ПАНЕЛІ (Верхня та Нижня) */
        .panel-base {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 260px; 
            background: rgba(30, 30, 30, 0.95);
            color: white;
            border: 1px solid #444;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 10000;
            padding: 10px;
            text-align: center;
        }

        .top-panel { top: 15px; }
        .bottom-panel { bottom: 25px; }

        .p-head { cursor: pointer; font-weight: bold; font-size: 14px; padding: 5px; }
        .p-content { display: none; margin-top: 10px; border-top: 1px solid #444; padding-top: 10px; max-height: 50vh; overflow-y: auto; }

        /* Стилі кнопок та черг */
        .srv-btn { display: block; width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; text-decoration: none; color: white; font-weight: bold; font-size: 13px; border: none; cursor: pointer; }
        .btn-tg { background: #0088cc; }
        .btn-vb { background: #7360f2; }
        .btn-chart { background: #444; }

        .leg-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 12px; justify-content: space-between; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
        .q-name { flex: 1; text-align: left; font-weight: bold; }
        .q-time { color: #ffd54f; font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="panel-base top-panel">
        <div class="p-head" onclick="togglePanel('topContent')">📢 Корисна інформація</div>
        <div id="topContent" class="p-content">
            <button class="srv-btn btn-chart" onclick="openChart()">📅 Графік на сьогодні</button>
            <a href="https://t.me/svitlo_in_Slavutych_News" target="_blank" class="srv-btn btn-tg">Telegram канал</a>
            <a href="https://invite.viber.com/?g2=AQBWONG%2BDtc6YVZaVt3j7%2BE73z2aD5aruhm7JFLEDXOExJuSOJZd6Ca2OsxdFHLo" target="_blank" class="srv-btn btn-vb">Viber канал</a>
        </div>
    </div>

    <iframe src="https://umap.openstreetmap.fr/uk-ua/map/map_1365338?scaleControl=false&miniMap=false&scrollWheelZoom=true&zoomControl=true&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=true"></iframe>

    <div class="panel-base bottom-panel">
        <div class="p-head" onclick="togglePanel('bottomContent')">📊 Статус черг (LIVE)</div>
        <div id="bottomContent" class="p-content">
            <div id="sheet-data">Завантаження...</div>
        </div>
    </div>

    <script>
        const SHEET_ID = "1QsynzpjvrRbZIagIdEd2TdjY228suZhXz8PxDJN8H68";
        const DATA_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=MapData`;

        function togglePanel(id) {
            const el = document.getElementById(id);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }

        function openChart() {
            window.open("https://raw.githubusercontent.com/amvasylets/Svitlo_in_Slavutych/refs/heads/main/charts/summary_today.png", "_blank");
        }

        async function loadData() {
            try {
                const res = await fetch(DATA_URL + "&t=" + Date.now());
                const csv = await res.text();
                const lines = csv.split('\n').slice(1);
                
                let html = '';
                const processed = new Set();

                lines.forEach(line => {
                    const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                    if (cols.length >= 10) {
                        const qName = cols[0].split(':')[0]; // Напр. "Черга 1.1"
                        if (!processed.has(qName)) {
                            html += `
                                <div class="leg-item">
                                    <div class="dot" style="background:${cols[1]}"></div>
                                    <div class="q-name">${qName}</div>
                                    <div class="q-time">${cols[9]}</div>
                                </div>`;
                            processed.add(qName);
                        }
                    }
                });
                document.getElementById('sheet-data').innerHTML = html || "Дані оновлюються...";
            } catch (e) { 
                console.error(e);
                document.getElementById('sheet-data').innerHTML = "Помилка зв'язку";
            }
        }

        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
