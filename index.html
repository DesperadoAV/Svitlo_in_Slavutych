<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/6qXnY1GR/1770893073813.png">
    <title>Світло Славутич</title>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        /* Верхній банер-меню */
        .banner-container { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 10000; width: 90%; max-width: 400px; }
        .main-btn { 
            background: rgba(30, 30, 30, 0.95); color: white; padding: 12px; border-radius: 15px; 
            text-align: center; font-weight: bold; cursor: pointer; border: 1px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .dropdown-menu { display: none; background: rgba(30, 30, 30, 0.98); margin-top: 10px; border-radius: 15px; padding: 15px; border: 1px solid #444; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .srv-btn { padding: 12px; border-radius: 10px; border: none; color: white; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; font-size: 14px; }
        .tg { background: #0088cc; }
        .vb { background: #7360f2; }
        .chart-btn { width: 100%; background: #444; padding: 12px; border-radius: 10px; border: none; color: white; font-weight: bold; cursor: pointer; }

        /* Динамічна легенда внизу */
        .map-legend { 
            position: absolute; bottom: 25px; right: 15px; 
            background: rgba(25, 25, 25, 0.9); padding: 12px; 
            border-radius: 12px; color: white; font-size: 12px; 
            border: 1px solid #333; min-width: 200px; z-index: 1000;
        }
        .leg-item { display: flex; align-items: center; margin-bottom: 6px; }
        .dot { height: 12px; width: 12px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; }
        .q-name { font-weight: bold; width: 30px; }
        .q-time { margin-left: auto; color: #ffd54f; font-weight: bold; }

        /* Модалка графіка */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:20000; justify-content:center; align-items:center; }
        .modal img { max-width: 95%; max-height: 90%; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="banner-container">
        <div class="main-btn" onclick="toggleMenu()">📢 Корисна інформація</div>
        <div class="dropdown-menu" id="myMenu">
            <div class="btn-grid">
                <a href="https://t.me/svitlo_in_Slavutych_News" target="_blank" class="srv-btn tg">Telegram</a>
                <a href="https://invite.viber.com/?g2=AQBWONG%2BDtc6YVZaVt3j7%2BE73z2aD5aruhm7JFLEDXOExJuSOJZd6Ca2OsxdFHLo" target="_blank" class="srv-btn vb">Viber</a>
            </div>
            <button class="chart-btn" onclick="openChart()">📅 Графік відключень</button>
        </div>
    </div>

    <div class="map-legend" id="sheet-data">Завантаження даних...</div>

    <div id="chartModal" class="modal" onclick="this.style.display='none'">
        <img id="chartImg" src="">
    </div>

    <iframe src="https://umap.openstreetmap.fr/uk-ua/map/map_1365338?scaleControl=false&miniMap=false&scrollWheelZoom=true&zoomControl=true&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=true"></iframe>

    <script>
        const SHEET_ID = "1QsynzpjvrRbZIagIdEd2TdjY228suZhXz8PxDJN8H68";
        const DATA_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=MapData`;

        function toggleMenu() {
            const m = document.getElementById('myMenu');
            m.style.display = (m.style.display === 'block') ? 'none' : 'block';
        }

        function openChart() {
            document.getElementById('chartImg').src = "https://raw.githubusercontent.com/amvasylets/Svitlo_in_Slavutych/refs/heads/main/charts/summary_today.png?t=" + Date.now();
            document.getElementById('chartModal').style.display = 'flex';
        }

        async function loadData() {
            try {
                const res = await fetch(DATA_URL);
                const csv = await res.text();
                const rows = csv.split('\n').slice(1);
                
                let html = '';
                rows.forEach(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                    if (cols.length >= 3) {
                        html += `
                            <div class="leg-item">
                                <div class="dot" style="background:${cols[1]}"></div>
                                <div class="q-name">${cols[0]}</div>
                                <div style="color:#aaa">${cols[2]}</div>
                                <div class="q-time">${cols[3] || ''}</div>
                            </div>
                        `;
                    }
                });
                document.getElementById('sheet-data').innerHTML = html || "Дані відсутні";
            } catch (e) {
                document.getElementById('sheet-data').innerHTML = "Помилка оновлення";
            }
        }

        // Оновлювати кожні 30 секунд
        setInterval(loadData, 30000);
        loadData();
    </script>
</body>
</html>
