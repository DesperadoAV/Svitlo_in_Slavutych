<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="icon" type="image/png" href="https://i.postimg.cc/6qXnY1GR/1770893073813.png">
    <title>Світло Славутич</title>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        /* Контейнер для банера */
        .banner-wrapper {
            position: absolute; 
            top: 10px; 
            left: 0; 
            right: 0;
            display: flex; 
            justify-content: center; 
            z-index: 10000;
            pointer-events: none;
        }

        #main-banner {
            pointer-events: auto;
            background: rgba(30, 30, 30, 0.9); 
            color: white;
            padding: 8px 16px; 
            border-radius: 25px;
            font-size: 14px; 
            font-weight: 600; 
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #444;
            transition: all 0.3s ease;
            text-align: center;
        }

        /* Внутрішнє меню (приховане за замовчуванням) */
        #menu-content { 
            display: none; 
            margin-top: 10px; 
            flex-direction: column; 
            gap: 10px; 
            min-width: 200px;
        }

        .btn-row { display: flex; gap: 8px; justify-content: center; }

        .btn-link {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-size: 13px;
            text-align: center;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .tg { background: #0088cc; }
        .vb { background: #7360f2; }

        /* Опускаємо кнопки мапи, щоб вони не заважали банеру */
        .leaflet-top.leaflet-left { margin-top: 60px !important; }
    </style>
</head>
<body>

    <div class="banner-wrapper">
        <div id="main-banner" onclick="toggleMenu()">
            <div id="banner-label">📢 Канали та Черги</div>
            
            <div id="menu-content">
                <div class="btn-row">
                    <a href="https://t.me/svitlo_in_Slavutych_News" target="_blank" class="btn-link tg">Telegram</a>
                    <a href="https://invite.viber.com/?g2=AQBWONG%2BDtc6YVZaVt3j7%2BE73z2aD5aruhm7JFLEDXOExJuSOJZd6Ca2OsxdFHLo" target="_blank" class="btn-link vb">Viber</a>
                </div>
            </div>
        </div>
    </div>

    <iframe src="https://umap.openstreetmap.fr/uk-ua/map/map_1365338?scaleControl=false&miniMap=false&scrollWheelZoom=false&zoomControl=true&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false"></iframe>

    <script>
        function toggleMenu() {
            const content = document.getElementById('menu-content');
            const isHidden = content.style.display === 'none' || content.style.display === '';
            content.style.display = isHidden ? 'flex' : 'none';
        }

        // Закриття меню при кліку на мапу (поза банером)
        window.onclick = function(event) {
            const banner = document.getElementById('main-banner');
            if (!banner.contains(event.target)) {
                document.getElementById('menu-content').style.display = 'none';
            }
        }
    </script>
</body>
</html>
