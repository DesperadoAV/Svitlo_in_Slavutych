<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/6qXnY1GR/1770893073813.png">
    <title>Світло Славутич - LIVE</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #f0f0f0; font-family: sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }
        
        /* Панелі */
        .panel { position: absolute; left: 50%; transform: translateX(-50%); background: rgba(30, 30, 30, 0.95); border: 1px solid #444; border-radius: 16px; z-index: 1000; color: white; width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .p-status { bottom: 20px; }
        .p-head { padding: 12px; text-align: center; font-weight: bold; cursor: pointer; font-size: 14px; }
        .p-body { padding: 10px; border-top: 1px solid #444; max-height: 45vh; overflow-y: auto; }

        .q-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 10px; }
        .eye-btn { cursor: pointer; font-size: 18px; }

        /* Стиль балуна */
        .leaflet-popup-content-wrapper { background: #fff; color: #333; border-radius: 8px; padding: 5px; }
        .status-tag { display: inline-block; padding: 3px 8px; border-radius: 4px; color: white; font-weight: bold; margin-top: 5px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="panel p-status">
        <div class="p-head" onclick="toggleBody()">📊 Статус черг (Керування)</div>
        <div class="p-body" id="s-body">
            <div id="queues-list">Оновлення даних...</div>
        </div>
    </div>

    <script>
        const SHEET_ID = "1QsynzpjvrRbZIagIdEd2TdjY228suZhXz8PxDJN8H68";
        const DATA_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=MapData`;

        // Ініціалізація мапи (стиль OpenStreetMap)
        const map = L.map('map', { zoomControl: false }).setView([51.5229, 30.7598], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let layers = {}; 
        let activeQueues = new Set(["1.1", "2.1", "3.1", "3.2", "4.1", "6.1"]);

        function toggleBody() {
            const b = document.getElementById('s-body');
            b.style.display = (b.style.display === 'none') ? 'block' : 'none';
        }

        async function loadPoints() {
            try {
                const res = await fetch(DATA_URL + "&t=" + Date.now());
                const csv = await res.text();
                const rows = csv.split('\n').slice(1);

                // Очищення старих точок
                Object.values(layers).forEach(l => map.removeLayer(l));
                layers = {};

                const queueInfo = {}; 

                rows.forEach(row => {
                    // Парсимо CSV
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                    if (cols.length < 11) return;

                    const fullAddr = cols[0]; // "Черга 1.1: вул..."
                    const qKey = fullAddr.includes("Черга") ? fullAddr.split(':')[0].replace('Черга ', '').trim() : "Інше";
                    const lat = parseFloat(cols[4]);
                    const lng = parseFloat(cols[5]);
                    const color = cols[1] || "#888";
                    const status = cols[7]; // Світло є/немає
                    const msg = cols[8]; // Повідомлення
                    const timeJ = cols[9]; 
                    const timeK = cols[10];

                    if (!layers[qKey]) layers[qKey] = L.layerGroup();
                    
                    const marker = L.circleMarker([lat, lng], {
                        radius: 8,
                        fillColor: color,
                        color: "#fff",
                        weight: 2,
                        fillOpacity: 0.9
                    });

                    marker.bindPopup(`
                        <div style="font-family: sans-serif; line-height: 1.4;">
                            <b style="font-size:14px;">${fullAddr}</b><br>
                            <span class="status-tag" style="background:${color}">${status}</span><br>
                            <div style="margin: 8px 0; font-size:13px; color:#444;">${msg}</div>
                            <hr style="border:0; border-top:1px solid #eee;">
                            <div style="font-size:11px; color:#888;">Оновлено: ${timeJ}<br>Прогноз: ${timeK}</div>
                        </div>
                    `);

                    marker.addTo(layers[qKey]);
                    if (!queueInfo[qKey]) queueInfo[qKey] = { color: color, time: timeJ };
                });

                renderList(queueInfo);
                refreshMap();
            } catch (e) { console.error("CSV Load Error:", e); }
        }

        function renderList(info) {
            let html = '';
            Object.keys(info).sort().forEach(q => {
                if (q === "Інше") return;
                const active = activeQueues.has(q);
                html += `
                    <div class="q-item">
                        <div style="display:flex; align-items:center; gap:8px">
                            <div style="width:12px; height:12px; border-radius:50%; background:${info[q].color}"></div>
                            <span style="font-size:13px; font-weight:bold;">Черга ${q}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:12px">
                            <span style="font-size:11px; color:#ffd54f">${info[q].time}</span>
                            <span class="eye-btn" onclick="toggleQ('${q}')">${active?'👁️':'🙈'}</span>
                        </div>
                    </div>`;
            });
            document.getElementById('queues-list').innerHTML = html || "Дані не знайдені";
        }

        function toggleQ(q) {
            if (activeQueues.has(q)) activeQueues.delete(q);
            else activeQueues.add(q);
            refreshMap();
            // Список не перевантажуємо повністю, а просто міняємо очі (швидкість)
            const icons = document.querySelectorAll('.eye-btn');
            loadPoints(); 
        }

        function refreshMap() {
            Object.keys(layers).forEach(q => {
                if (activeQueues.has(q)) layers[q].addTo(map);
                else map.removeLayer(layers[q]);
            });
        }

        // Запуск
        loadPoints();
        setInterval(loadPoints, 35000);
    </script>
</body>
</html>
