<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/6qXnY1GR/1770893073813.png">
    <title>ТЕСТ: Світло Славутич</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        /* СПІЛЬНИЙ СТИЛЬ ДЛЯ ОБОХ ПАНЕЛЕЙ */
        .panel-base {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 220px; 
            background: rgba(30, 30, 30, 0.95);
            color: white;
            border: 1px solid #444;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 10000;
            padding: 10px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .panel-title { text-align: center; font-weight: bold; cursor: pointer; font-size: 13px; }
        
        .panel-content { 
            display: none; 
            margin-top: 10px; 
            border-top: 1px solid #444; 
            padding-top: 10px;
            max-height: 50vh; 
            overflow-y: auto; 
        }

        .top-panel { top: 15px; }
        .bottom-panel { bottom: 25px; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
        .srv-btn { padding: 8px; border-radius: 8px; border: none; color: white; font-weight: bold; cursor: pointer; text-align: center; font-size: 12px; text-decoration: none; }
        .tg { background: #0088cc; }
        .vb { background: #7360f2; }
        .chart-btn { width: 100%; background: #444; padding: 10px; border-radius: 8px; border: none; color: white; font-weight: bold; cursor: pointer; font-size: 11px; }
        
        .queues-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 5px; }
        .q-item { display: flex; align-items: center; background: #252525; padding: 8px; border-radius: 6px; color: white; text-decoration: none; font-size: 11px; border: 1px solid #333; }
        .q-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; flex-shrink: 0; }
        .back-btn { background: none; border: none; color: #0088cc; cursor: pointer; padding: 0 0 8px 0; font-size: 11px; }

        .leg-item { display: flex; align-items: center; margin-bottom: 6px; font-size: 12px; }
        .dot { height: 12px; width: 12px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1); }
        .q-name { font-weight: bold; width: 30px; }
        .q-time { margin-left: auto; color: #ffd54f; font-weight: bold; }

        /* Стиль для кнопки-ока */
        .eye-btn { 
            margin-left: 10px; 
            cursor: pointer; 
            font-size: 14px; 
            filter: grayscale(1); 
            transition: filter 0.3s;
        }
        .eye-btn.active { filter: grayscale(0); }

        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:20000; justify-content:center; align-items:center; }
        .modal img { max-width: 95%; max-height: 90%; border-radius: 10px; border: 1px solid #555; }
    </style>
</head>
<body>

    <div class="top-panel panel-base" id="topPanel">
        <div class="panel-title" onclick="togglePanel('topContent')">📢 Корисна інформація</div>
        <div class="panel-content" id="topContent">
            <div id="step1">
                <div class="btn-grid">
                    <div class="srv-btn tg" onclick="showQueues('tg')">Telegram</div>
                    <div class="srv-btn vb" onclick="showQueues('vb')">Viber</div>
                </div>
                <button class="chart-btn" onclick="openChart()">📅 Графік відключень</button>
            </div>
            <div id="step2" style="display: none;">
                <button class="back-btn" onclick="goBack()">← Назад</button>
                <div class="queues-grid" id="queuesList"></div>
                <a id="newsLink" href="#" target="_blank" class="q-item" style="grid-column: span 2; justify-content: center; margin-top: 8px; background: #333; font-weight: bold;">🔔 Канал новин</a>
            </div>
        </div>
    </div>

    <div class="bottom-panel panel-base" id="bottomPanel">
        <div class="panel-title" onclick="togglePanel('bottomContent')">📊 Статус черг (Керування мапою)</div>
        <div class="panel-content" id="bottomContent">
            <div id="sheet-data">Завантаження...</div>
        </div>
    </div>

    <div id="chartModal" class="modal" onclick="this.style.display='none'"><img id="chartImg" src=""></div>

    <iframe id="umap-iframe" src="https://umap.openstreetmap.fr/uk-ua/map/map_1371725?datalayers=3690623,3690627,3690628,3690629,3690630,3690631#15/51.5229/30.7598"></iframe>

    <script>
        const SHEET_ID = "1QsynzpjvrRbZIagIdEd2TdjY228suZhXz8PxDJN8H68";
        const DATA_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=MapData`;

        // Справжні ID шарів Славутича
        const layerIds = {
            "1.1": "3690623", 
            "2.1": "3690627",
            "3.1": "3690628",
            "3.2": "3690629",
            "4.1": "3690630",
            "6.1": "3690631"
        };

        // Стан мапи: за замовчуванням всі черги увімкнені
        let activeQueues = ["1.1", "2.1", "3.1", "3.2", "4.1", "6.1"];

        function togglePanel(id) {
            const content = document.getElementById(id);
            const isVisible = content.style.display === 'block';
            content.style.display = isVisible ? 'none' : 'block';
            if (id === 'topContent' && isVisible) goBack();
        }

        // Функція перемикання шарів на мапі
        function toggleMapLayer(q, event) {
            event.stopPropagation(); // Щоб панель не закрилася при кліку на око
            const index = activeQueues.indexOf(q);

            if (index > -1) {
                activeQueues.splice(index, 1);
            } else {
                activeQueues.push(q);
            }
            updateMap();
            loadData(); // Оновлюємо статус, щоб змінити вигляд ока
        }

        function updateMap() {
            const frame = document.getElementById('umap-iframe');
            const baseUrl = "https://umap.openstreetmap.fr/uk-ua/map/map_1371725";
            const visibleIds = activeQueues.map(q => layerIds[q]).filter(id => id).join(',');
            frame.src = `${baseUrl}?datalayers=${visibleIds}#15/51.5229/30.7598`;
        }

        async function loadData() {
            try {
                const res = await fetch(DATA_URL + "&t=" + Date.now());
                const csv = await res.text();
                const rows = csv.split('\n').slice(1);
                let html = '';
                rows.forEach(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                    if (cols.length >= 3) {
                        const qName = cols[0].replace('Черга ', '');
                        const isActive = activeQueues.includes(qName);
                        const eyeIcon = isActive ? "👁️" : "🙈";
                        const eyeClass = isActive ? "active" : "";

                        html += `
                        <div class="leg-item">
                            <div class="dot" style="background:${cols[1]}"></div>
                            <div class="q-name">${cols[0]}</div>
                            <div style="color:#aaa">${cols[2]}</div>
                            <div class="q-time">${cols[3] || ''}</div>
                            <div class="eye-btn ${eyeClass}" onclick="toggleMapLayer('${qName}', event)">${eyeIcon}</div>
                        </div>`;
                    }
                });
                document.getElementById('sheet-data').innerHTML = html || "Дані відсутні";
            } catch (e) { console.error(e); }
        }

        // --- ВАШІ ОРИГІНАЛЬНІ ФУНКЦІЇ БЕЗ ЗМІН ---
        const links = {
            tg: { news: "https://t.me/svitlo_in_Slavutych_News", items: [
                {n: "1.1", c: "#EF4444", url: "https://t.me/svitlo_in_Slavutych_1_1"},
                {n: "2.1", c: "#3B82F6", url: "https://t.me/svitlo_in_Slavutych_2_1"},
                {n: "3.1", c: "#A855F7", url: "https://t.me/svitlo_in_Slavutych_3_1"},
                {n: "3.2", c: "#F59E0B", url: "https://t.me/svitlo_in_Slavutych_3_2"},
                {n: "4.1", c: "#F97316", url: "https://t.me/svitlo_in_Slavutych_4_1"},
                {n: "6.1", c: "#10B981", url: "https://t.me/svitlo_in_Slavutych_6_1"}
            ]},
            vb: { news: "https://invite.viber.com/?g2=AQBWONG%2BDtc6YVZaVt3j7%2BE73z2aD5aruhm7JFLEDXOExJuSOJZd6Ca2OsxdFHLo", items: [
                {n: "1.1", c: "#EF4444", url: "https://invite.viber.com/?g2=AQAwYtpyJWoodlZaVSylf8qXJh%2BIkorI%2BUEIlSNEjLY97kwXcxRXWcee8Wt%2FJM%2FS"},
                {n: "2.1", c: "#3B82F6", url: "https://invite.viber.com/?g2=AQBXEog0eJuMg1ZaVvzFZ14R%2Bq%2B3qDs5gmfU3pLXpwkPygNpg43EBTllJkScCQI6"},
                {n: "3.1", c: "#A855F7", url: "https://invite.viber.com/?g2=AQA8UIh2a1ur71ZaVlCe5j56cKWAwAem1kuhxYeCg9xsUb8AFCKgRE5duiSA3fvW"},
                {n: "3.2", c: "#F59E0B", url: "https://invite.viber.com/?g2=AQA9Od9EXDrYslZaNY2rHJ1v1t8S5lA9RGxcLlvDP4ujK3n%2BHMvVHzeWmldseJdN"},
                {n: "4.1", c: "#F97316", url: "https://invite.viber.com/?g2=AQAr4i0FDuS0TlZaWDF6W2Hk%2BTDJrVrCLKTBQSvAwDb7JPuDYn0HE0WtouQyqIm7"},
                {n: "6.1", c: "#10B981", url: "https://invite.viber.com/?g2=AQBP%2BePVKBjDBFZaVeCnWMT9gn%2Fl2vl2636E%2B9vRvecZjNegiPbNxN93KG90spyY"}
            ]}
        };

        function showQueues(srv) {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            document.getElementById('newsLink').href = links[srv].news;
            const list = document.getElementById('queuesList');
            list.innerHTML = links[srv].items.map(i => `<a href="${i.url}" target="_blank" class="q-item"><div class="q-dot" style="background:${i.c}"></div>${i.n}</a>`).join('');
        }

        function goBack() {
            document.getElementById('step1').style.display = 'block';
            document.getElementById('step2').style.display = 'none';
        }

        function openChart() {
            document.getElementById('chartImg').src = "https://raw.githubusercontent.com/amvasylets/Svitlo_in_Slavutych/refs/heads/main/charts/summary_today.png?t=" + Date.now();
            document.getElementById('chartModal').style.display = 'flex';
        }

        loadData();
        setInterval(loadData, 30000);

        window.onclick = function(e) {
            if (!document.getElementById('topPanel').contains(e.target) && !document.getElementById('bottomPanel').contains(e.target)) {
                document.getElementById('topContent').style.display = 'none';
                document.getElementById('bottomContent').style.display = 'none';
                goBack();
            }
        };
    </script>
</body>
</html>
