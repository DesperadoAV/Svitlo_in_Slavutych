<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/6qXnY1GR/1770893073813.png">
    <title>Світло Славутич - LIVE</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        #bg-map { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; z-index: 1; }

        .panel { position: absolute; left: 50%; transform: translateX(-50%); background: rgba(25,25,25,0.98); border: 1px solid #444; border-radius: 16px; z-index: 2000; color: white; width: 290px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .p-status { bottom: 30px; display: block; }
        .p-head { padding: 15px; text-align: center; font-weight: bold; cursor: pointer; background: #333; font-size: 14px; border-radius: 16px; }
        .p-body { padding: 15px; border-top: 1px solid #444; max-height: 50vh; overflow-y: auto; display: block; }

        .q-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; }
        .q-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 10px; }
        .q-time { color: #ffd54f; font-weight: bold; font-size: 13px; }
        .eye-btn { cursor: pointer; font-size: 20px; text-shadow: 0 0 5px black; }
    </style>
</head>
<body>

    <div class="panel p-status">
        <div class="p-head">📊 Статус черг</div>
        <div class="p-body" id="queues-container">
            <div style="text-align:center; padding:20px;">Завантаження...</div>
        </div>
    </div>

    <iframe id="bg-map" src="about:blank"></iframe>

    <script>
        // Ваші налаштування
        const SHEET_ID = "1QsynzpjvrRbZIagIdEd2TdjY228suZhXz8PxDJN8H68";
        const DATA_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=MapData`;
        
        const layerIds = {
            "1.1": "3707578", "2.1": "3707579", "3.1": "3707580", 
            "3.2": "3707581", "4.1": "3707582", "6.1": "3707584"
        };
        
        let activeQueues = Object.keys(layerIds);

        function updateMap() {
            const ids = activeQueues.map(q => layerIds[q]).filter(id => id).join(',');
            const url = `https://umap.openstreetmap.fr/uk-ua/map/map_1371725?datalayers=${ids}#15/51.5229/30.7598`;
            document.getElementById('bg-map').src = url;
        }

        async function loadData() {
            console.log("Запит до таблиці...");
            try {
                const response = await fetch(DATA_URL + "&t=" + Date.now());
                const text = await response.text();
                const lines = text.split('\n');
                
                let html = '';
                const seen = new Set();

                // Пропускаємо заголовок (i=1)
                for (let i = 1; i < lines.length; i++) {
                    // Простий розбір CSV рядка
                    const cols = lines[i].split(',').map(c => c.replace(/"/g, '').trim());
                    if (cols.length < 2) continue;

                    const rawName = cols[0]; // Напр. "Черга 1.1"
                    const qKey = rawName.replace('Черга ', ''); // "1.1"

                    if (layerIds[qKey] && !seen.has(qKey)) {
                        const isActive = activeQueues.includes(qKey);
                        html += `
                            <div class="q-item">
                                <div style="display:flex; align-items:center;">
                                    <div class="q-dot" style="background:${cols[1] || '#888'}"></div>
                                    <div>
                                        <div style="font-weight:bold; font-size:14px;">${rawName}</div>
                                        <div class="q-time">${cols[9] || '--:--'}</div>
                                    </div>
                                </div>
                                <div class="eye-btn" onclick="toggleLayer('${qKey}')">${isActive ? '👁️' : '🙈'}</div>
                            </div>`;
                        seen.add(qKey);
                    }
                }
                
                document.getElementById('queues-container').innerHTML = html || "Дані не знайдено в таблиці";
            } catch (err) {
                console.error("Помилка:", err);
                document.getElementById('queues-container').innerHTML = "Помилка зв'язку з Google";
            }
        }

        function toggleLayer(q) {
            const idx = activeQueues.indexOf(q);
            if (idx > -1) activeQueues.splice(idx, 1);
            else activeQueues.push(q);
            
            updateMap();
            loadData(); // Перемалювати список з новими очима
        }

        // Старт
        updateMap();
        loadData();
        setInterval(loadData, 40000);
    </script>
</body>
</html>
