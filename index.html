<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/6qXnY1GR/1770893073813.png">
    <title>Світло Славутич - LIVE</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        #bg-map { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Власні кнопки керування (зліва) */
        .map-controls { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 12px; z-index: 1000; }
        .m-btn { width: 45px; height: 45px; background: rgba(35,35,35,0.95); border: 1px solid #444; color: white; border-radius: 12px; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.6); transition: 0.2s; }
        .m-btn:active { transform: scale(0.9); }

        /* Екстрене повідомлення */
        #emergency-banner { position: absolute; top: 0; width: 100%; background: #ff3b30; color: white; padding: 10px 0; font-weight: bold; z-index: 5000; display: none; overflow: hidden; }
        .marquee { display: inline-block; padding-left: 100%; animation: marquee 20s linear infinite; white-space: nowrap; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        /* Панелі (Банери) */
        .panel { position: absolute; left: 50%; transform: translateX(-50%); background: rgba(25,25,25,0.98); border: 1px solid #333; border-radius: 16px; z-index: 2000; color: white; width: 280px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); display: none; overflow: hidden; }
        .p-info { top: 20px; }
        .p-status { bottom: 30px; display: block; } /* Статус завжди видно як заголовок */
        
        .p-head { padding: 15px; text-align: center; font-weight: bold; cursor: pointer; background: rgba(40,40,40,0.5); font-size: 14px; }
        .p-body { padding: 15px; border-top: 1px solid #333; max-height: 60vh; overflow-y: auto; }

        /* Стилі черг */
        .q-item { display: flex; align-items: center; margin-bottom: 10px; font-size: 13px; padding: 4px 0; }
        .q-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 10px; }
        .q-name { flex: 1; font-weight: bold; }
        .q-time { color: #ffd54f; font-weight: bold; margin-right: 10px; }
        .eye-btn { cursor: pointer; font-size: 16px; opacity: 0.4; }
        .eye-btn.active { opacity: 1; }

        /* Кнопки месенджерів (всередині Інфо) */
        .srv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .srv-btn { padding: 10px; border-radius: 8px; text-align: center; text-decoration: none; color: white; font-weight: bold; font-size: 12px; }
        .btn-tg { background: #0088cc; }
        .btn-vb { background: #7360f2; }
    </style>
</head>
<body>

    <div id="emergency-banner"><div class="marquee" id="emergency-text"></div></div>

    <div class="map-controls">
        <button class="m-btn" onclick="zoomIn()">+</button>
        <button class="m-btn" onclick="zoomOut()">-</button>
        <button class="m-btn" onclick="togglePanel('info-panel')">ℹ️</button>
    </div>

    <div class="panel p-info" id="info-panel">
        <div class="p-head" onclick="togglePanel('info-panel')">📢 Корисна інформація</div>
        <div class="p-body">
            <button onclick="openChart()" style="width:100%; padding:12px; background:#444; border:none; color:white; border-radius:10px; cursor:pointer; font-weight:bold; margin-bottom:15px;">📅 Графік на сьогодні</button>
            <div style="font-size: 12px; color: #aaa; margin-bottom: 5px;">Наші канали та чати:</div>
            <div class="srv-grid">
                <a href="https://t.me/svitlo_in_Slavutych_News" target="_blank" class="srv-btn btn-tg">Telegram</a>
                <a href="https://invite.viber.com/?g2=AQBWONG%2BDtc6YVZaVt3j7%2BE73z2aD5aruhm7JFLEDXOExJuSOJZd6Ca2OsxdFHLo" target="_blank" class="srv-btn btn-vb">Viber</a>
            </div>
            <div id="visitor-stats" style="margin-top:15px; font-size:10px; color:#555; text-align:center;"></div>
        </div>
    </div>

    <div class="panel p-status" style="display:block;">
        <div class="p-head" id="status-toggle" onclick="toggleStatusBody()">📊 Статус черг</div>
        <div class="p-body" id="status-body" style="display:none;">
            <div id="queues-container">Завантаження даних...</div>
        </div>
    </div>

    <iframe id="bg-map" src="https://umap.openstreetmap.fr/uk-ua/map/map_1371725?scaleControl=false&miniMap=false&scrollWheelZoom=true&zoomControl=false&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=false"></iframe>

    <script>
        const SHEET_ID = "1QsynzpjvrRbZIagIdEd2TdjY228suZhXz8PxDJN8H68";
        const DATA_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=MapData`;
        
        // Стан черг (6 штук)
        let activeQueues = ["1.1", "2.1", "3.1", "3.2", "4.1", "6.1"];
        const layerIds = {"1.1": "3707578", "2.1": "3707579", "3.1": "3707580", "3.2": "3707581", "4.1": "3707582", "6.1": "3707584"};

        function togglePanel(id) {
            const p = document.getElementById(id);
            p.style.display = (p.style.display === 'block') ? 'none' : 'block';
        }

        function toggleStatusBody() {
            const b = document.getElementById('status-body');
            b.style.display = (b.style.display === 'block') ? 'none' : 'block';
        }

        function toggleLayer(q, event) {
            event.stopPropagation();
            const idx = activeQueues.indexOf(q);
            if (idx > -1) activeQueues.splice(idx, 1);
            else activeQueues.push(q);
            updateMap();
            loadData();
        }

        function updateMap() {
            const ids = activeQueues.map(q => layerIds[q]).join(',');
            document.getElementById('bg-map').src = `https://umap.openstreetmap.fr/uk-ua/map/map_1371725?datalayers=${ids}#15/51.5229/30.7598`;
        }

        async function loadData() {
            try {
                const res = await fetch(DATA_URL + "&t=" + Date.now());
                const csv = await res.text();
                const rows = csv.split('\n').slice(1);
                
                let html = '';
                // Беремо перші 6 унікальних черг для списку
                const processed = new Set();
                
                rows.forEach(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                    const qName = cols[0].replace('Черга ', '');
                    
                    if (!processed.has(qName) && layerIds[qName]) {
                        const isActive = activeQueues.includes(qName);
                        html += `
                            <div class="q-item">
                                <div class="q-dot" style="background:${cols[1]}"></div>
                                <div class="q-name">Черга ${qName}</div>
                                <div class="q-time">${cols[9]}</div>
                                <div class="eye-btn ${isActive?'active':''}" onclick="toggleLayer('${qName}', event)">${isActive?'👁️':'🙈'}</div>
                            </div>`;
                        processed.add(qName);
                    }
                    
                    // Перевірка на екстрене повідомлення (якщо в стовпці I є спец. мітка)
                    if (cols[8] && cols[8].includes("!!!")) {
                        const banner = document.getElementById('emergency-banner');
                        banner.style.display = 'block';
                        document.getElementById('emergency-text').innerText = cols[8].replace("!!!", "");
                    }
                });
                document.getElementById('queues-container').innerHTML = html;
            } catch (e) { console.error(e); }
        }

        // Функції зуму
        function zoomIn() { alert("Використовуйте подвійний клік на мапі"); }
        function zoomOut() { alert("Використовуйте коліщатко миші"); }

        function openChart() {
            window.open("https://raw.githubusercontent.com/amvasylets/Svitlo_in_Slavutych/refs/heads/main/charts/summary_today.png", "_blank");
        }

        // Невидимий лічильник
        const img = new Image();
        img.src = "https://script.google.com/macros/s/AKfycbyjYyCqG6M_W4B2S-7mO3W5J6y7C8V9B0/exec?t=" + Date.now();

        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
