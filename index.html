<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/6qXnY1GR/1770893073813.png">
    <title>Світло Славутич - Мапа статусів</title>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        /* Динамічна легенда черг (нижній правий кут) */
        .queue-legend { 
            position: absolute; bottom: 20px; right: 10px; 
            background: rgba(30, 30, 30, 0.95); padding: 12px; 
            border-radius: 12px; z-index: 1000; color: white; 
            font-size: 11px; display: flex; flex-direction: column; 
            gap: 8px; border: 1px solid #444; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            min-width: 180px;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .dot { height: 12px; width: 12px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.2); }
        .queue-name { font-weight: bold; min-width: 25px; }
        .queue-status { color: #ccc; }
        .queue-time { color: #ffeb3b; font-weight: bold; margin-left: auto; padding-left: 10px; }

        /* Банер меню зверху */
        .banner-wrapper { position: absolute; top: 10px; left: 0; right: 0; display: flex; justify-content: center; z-index: 10000; pointer-events: none; }
        #main-banner { pointer-events: auto; background: rgba(30, 30, 30, 0.95); color: white; padding: 10px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.6); border: 1px solid #444; }
        #menu-content { display: none; flex-direction: column; gap: 10px; margin-top: 10px; }
        .q-link { display: flex; align-items: center; background: #252525; padding: 8px 10px; border-radius: 8px; color: white; text-decoration: none; font-size: 12px; border: 1px solid #333; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 20000; justify-content: center; align-items: center; }
        .modal-content { max-width: 95%; max-height: 90%; border-radius: 12px; border: 2px solid #444; }
        
        /* Корекція кнопок мапи */
        .leaflet-top.leaflet-left { margin-top: 65px !important; }
    </style>
</head>
<body>

    <div id="imageModal" class="modal-overlay" onclick="closeChart()">
        <img id="modalImg" class="modal-content" src="" alt="Графік">
    </div>

    <div class="banner-wrapper">
        <div id="main-banner" onclick="toggleMenu(event)">
            <div id="banner-label">📢 Корисна інформація</div>
            <div id="menu-content">
                <div id="step-1">
                    <button class="q-link" style="justify-content: center; background: #3a3a3a; font-weight: bold; width: 100%; cursor: pointer;" onclick="openChart(event)">
                       📅 Поточні відключення
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="queue-legend" id="dynamic-legend">
        Завантаження статусів...
    </div>

    <iframe src="https://umap.openstreetmap.fr/uk-ua/map/map_1365338?scaleControl=false&miniMap=false&scrollWheelZoom=true&zoomControl=true&editMode=disabled&moreControl=false&searchControl=false&tilelayersControl=false&embedControl=false&datalayersControl=true"></iframe>

    <script>
        const SHEET_ID = "1QsynzpjvrRbZIagIdEd2TdjY228suZhXz8PxDJN8H68";
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=MapData`;

        async function updateDataFromSheet() {
            try {
                const response = await fetch(CSV_URL);
                const text = await response.text();
                
                // Розбиваємо CSV (враховуємо можливі коми в текстах статусів)
                const rows = text.split('\n').slice(1); // Пропускаємо заголовок
                
                let html = '';
                rows.forEach(row => {
                    // Регулярний вираз для коректного парсингу CSV з лапками
                    const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
                    if (cols.length >= 4) {
                        const name = cols[0].replace(/"/g, '');
                        const color = cols[1].replace(/"/g, '');
                        const status = cols[2].replace(/"/g, '');
                        const time = cols[3].replace(/"/g, '');

                        html += `
                            <div class="legend-item">
                                <span class="dot" style="background: ${color};"></span>
                                <span class="queue-name">${name}</span>
                                <span class="queue-status">${status}</span>
                                <span class="queue-time">${time}</span>
                            </div>
                        `;
                    }
                });
                
                if (html) document.getElementById('dynamic-legend').innerHTML = html;
            } catch (error) {
                console.error("Помилка оновлення даних:", error);
                document.getElementById('dynamic-legend').innerHTML = "Помилка зв'язку з таблицею";
            }
        }

        // Функції інтерфейсу
        function toggleMenu(e) {
            const content = document.getElementById('menu-content');
            if (e.target.id === 'banner-label' || e.target.id === 'main-banner') {
                content.style.display = (content.style.display === 'flex') ? 'none' : 'flex';
            }
        }

        function openChart(e) {
            e.stopPropagation();
            const img = document.getElementById('modalImg');
            img.src = "https://raw.githubusercontent.com/amvasylets/Svitlo_in_Slavutych/refs/heads/main/charts/summary_today.png?t=" + Date.now();
            document.getElementById('imageModal').style.display = 'flex';
        }

        function closeChart() { document.getElementById('imageModal').style.display = 'none'; }

        // Початковий запуск та таймери
        updateDataFromSheet();
        setInterval(updateDataFromSheet, 30000); // Оновлення легенди кожні 30 сек

        // Закриття меню при кліку в іншому місці
        window.onclick = function(event) {
            if (!document.getElementById('main-banner').contains(event.target)) {
                document.getElementById('menu-content').style.display = 'none';
            }
        }
    </script>
</body>
</html>
