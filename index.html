<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Світло Славутич</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
        
        #timer-box { display: none; } /* Таймер приховано, але він працює */

        /* Стилі банера */
        #top-banner {
            position: absolute; top: 0; left: 0; right: 0;
            background: rgba(0, 123, 255, 0.9); color: white;
            text-align: center; padding: 8px; cursor: pointer;
            z-index: 10000; font-weight: bold; font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Меню вибору */
        #links-overlay {
            display: none; position: absolute; top: 40px; left: 10px; right: 10px;
            background: #222; border-radius: 8px; padding: 15px;
            z-index: 10001; border: 1px solid #444; color: white;
        }

        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .main-btn { flex: 1; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; }
        .tg-color { background: #0088cc; }
        .vb-color { background: #7360f2; }
        
        .queue-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .queue-link { 
            display: flex; align-items: center; background: #333; 
            padding: 8px; border-radius: 5px; color: white; 
            text-decoration: none; font-size: 13px; border: 1px solid #444;
        }
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .close-btn { background: #555; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="top-banner" onclick="toggleMenu()">📢 Наші канали в Telegram та Viber (тисніть тут)</div>

    <div id="links-overlay">
        <div class="btn-group">
            <button class="main-btn tg-color" onclick="showQueues('tg')">Telegram</button>
            <button class="main-btn vb-color" onclick="showQueues('vb')">Viber</button>
        </div>

        <div id="queue-container" class="queue-list">
            </div>
        <button class="main-btn close-btn" onclick="toggleMenu()">Закрити</button>
    </div>

    <div id="timer-box"><span id="timer">180</span></div>
    
    <iframe id="map" src="https://umap.openstreetmap.fr/uk-ua/map/map_1365338?scaleControl=false&miniMap=false&scrollWheelZoom=false&zoomControl=true&editMode=disabled&moreControl=true&searchControl=null&tilelayersControl=null&embedControl=null&datalayersControl=true&onLoadPanel=none&captionBar=false&captionMenus=true"></iframe>

    <script>
        const data = {
            tg: [
                {n: 'Черга 1.1', c: 'red', l: 'https://t.me/svitlo_in_Slavutych_1_1'},
                {n: 'Черга 2.1', c: 'blue', l: 'https://t.me/svitlo_in_Slavutych_2_1'},
                {n: 'Черга 3.1', c: 'purple', l: 'https://t.me/svitlo_in_Slavutych_3_1'},
                {n: 'Черга 3.2', c: 'yellow', l: 'https://t.me/svitlo_in_Slavutych_3_2'},
                {n: 'Черга 4.1', c: 'orange', l: 'https://t.me/svitlo_in_Slavutych_4_1'},
                {n: 'Черга 6.1', c: 'green', l: 'https://t.me/svitlo_in_Slavutych_6_1'},
                {n: 'Новини', c: 'white', l: 'https://t.me/svitlo_in_Slavutych_News'}
            ],
            vb: [
                {n: 'Черга 1.1', c: 'red', l: 'https://invite.viber.com/?g2=AQAwYtpyJWoodlZaVSylf8qXJh%2BIkorI%2BUEIlSNEjLY97kwXcxRXWcee8Wt%2FJM%2FS'},
                {n: 'Черга 2.1', c: 'blue', l: 'https://invite.viber.com/?g2=AQBXEog0eJuMg1ZaVvzFZ14R%2Bq%2B3qDs5gmfU3pLXpwkPygNpg43EBTllJkScCQI6'},
                {n: 'Черга 3.1', c: 'purple', l: 'https://invite.viber.com/?g2=AQA8UIh2a1ur71ZaVlCe5j56cKWAwAem1kuhxYeCg9xsUb8AFCKgRE5duiSA3fvW'},
                {n: 'Черга 3.2', c: 'yellow', l: 'https://invite.viber.com/?g2=AQA9Od9EXDrYslZaNY2rHJ1v1t8S5lA9RGxcLlvDP4ujK3n%2BHMvVHzeWmldseJdN'},
                {n: 'Черга 4.1', c: 'orange', l: 'https://invite.viber.com/?g2=AQAr4i0FDuS0TlZaWDF6W2Hk%2BTDJrVrCLKTBQSvAwDb7JPuDYn0HE0WtouQyqIm7'},
                {n: 'Черга 6.1', c: 'green', l: 'https://invite.viber.com/?g2=AQBP%2BePVKBjDBFZaVeCnWMT9gn%2Fl2vl2636E%2B9vRvecZjNegiPbNxN93KG90spyY'},
                {n: 'Новини', c: 'white', l: 'https://invite.viber.com/?g2=AQBWONG%2BDtc6YVZaVt3j7%2BE73z2aD5aruhm7JFLEDXOExJuSOJZd6Ca2OsxdFHLo'}
            ]
        };

        function toggleMenu() {
            const menu = document.getElementById('links-overlay');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
            if (menu.style.display === 'block') showQueues('tg');
        }

        function showQueues(type) {
            const container = document.getElementById('queue-container');
            container.innerHTML = data[type].map(item => `
                <a href="${item.l}" target="_blank" class="queue-link">
                    <span class="dot" style="background-color: ${item.c}"></span> ${item.n}
                </a>
            `).join('');
        }

        // Таймер оновлення
        let seconds = 180;
        setInterval(() => {
            seconds--;
            document.getElementById('timer').textContent = seconds;
            if (seconds <= 0) {
                document.getElementById('map').src = document.getElementById('map').src;
                seconds = 180;
            }
        }, 1000);
    </script>
</body>
</html>
