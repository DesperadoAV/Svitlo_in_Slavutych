<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/6qXnY1GR/1770893073813.png">
    <title>Світло Славутич - LIVE</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }
        
        /* Панелі керування */
        .panel { position: absolute; left: 50%; transform: translateX(-50%); background: rgba(25,25,25,0.95); border: 1px solid #444; border-radius: 16px; z-index: 1000; color: white; width: 280px; }
        .p-status { bottom: 20px; }
        .p-head { padding: 12px; text-align: center; font-weight: bold; cursor: pointer; font-size: 14px; }
        .p-body { padding: 10px; border-top: 1px solid #444; max-height: 40vh; overflow-y: auto; }

        .q-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 10px; }
        .eye-btn { cursor: pointer; font-size: 18px; }

        /* Стиль вікна при кліку на будинок */
        .leaflet-popup-content-wrapper { background: #222; color: white; border-radius: 12px; }
        .leaflet-popup-tip { background: #222; }
        .status-tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="panel p-status">
        <div class="p-head" onclick="document.getElementById('s-body').style.display = (document.getElementById('s-body').style.display=='none'?'block':'none')">📊 Керування чергами</div>
        <div class="p-body" id="s-body">
            <div id="queues-list">Завантаження...</div>
        </div>
    </div>

    <script>
        const SHEET_ID = "1QsynzpjvrRbZIagIdEd2TdjY228suZhXz8PxDJN8H68";
        const DATA_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=MapData`;

        // Створюємо мапу (uMap використовуємо тільки як картинку-підкладку)
        const map = L.map('map', { zoomControl: false }).setView([51.5229, 30.7598], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png').addTo(map);

        let layers = {}; // Об'єкт для зберігання груп точок по чергах
        let activeQueues = new Set(["1.1", "2.1", "3.1", "3.2", "4.1", "6.1"]);

        async function loadPoints() {
            try {
                const res = await fetch(DATA_URL + "&t=" + Date.now());
                const csv = await res.text();
                const rows = csv.split('\n').slice(1);

                // Очищаємо старі шари
                Object.values(layers).forEach(layer => map.removeLayer(layer));
                layers = {};

                const queueInfo = {}; // Для списку черг

                rows.forEach(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                    if (cols.length < 10) return;

                    const addr = cols[0]; // Напр. "Черга 1.1: вул. Миру 5"
                    const qKey = addr.split(':')[0].replace('Черга ', '').trim();
                    const lat = parseFloat(cols[4]); // Стовпець E
                    const lng = parseFloat(cols[5]); // Стовпець F
                    const color = cols[1]; // Стовпець B
                    const statusText = cols[7]; // Стовпець H (Світло є/немає)
                    const userMsg = cols[8]; // Стовпець I (Повідомлення)
                    const timeInfo = `${cols[9]} | ${cols[10]}`; // J та K

                    if (!layers[qKey]) layers[qKey] = L.layerGroup();
                    
                    // Створюємо крапку
                    const marker = L.circleMarker([lat, lng], {
                        radius: 7,
                        fillColor: color,
                        color: "#fff",
                        weight: 1,
                        fillOpacity: 0.9
                    });

                    // Вікно при кліку (Балун)
                    marker.bindPopup(`
                        <div style="text-align:center">
                            <b>${addr}</b><br>
                            <span class="status-tag" style="background:${color}">${statusText}</span><br>
                            <p style="font-size:12px; margin:10px 0;">${userMsg}</p>
                            <small style="color:#aaa">${timeInfo}</small>
                        </div>
                    `);

                    marker.addTo(layers[qKey]);
                    
                    // Зберігаємо інфо для списку
                    if (!queueInfo[qKey]) queueInfo[qKey] = { color: color, time: cols[9] };
                });

                renderList(queueInfo);
                refreshMap();
            } catch (e) { console.error(e); }
        }

        function renderList(info) {
            let html = '';
            Object.keys(info).sort().forEach(q => {
                const active = activeQueues.has(q);
                html += `
                    <div class="q-item">
                        <div style="display:flex; align-items:center; gap:8px">
                            <div style="width:10px; height:10px; border-radius:50%; background:${info[q].color}"></div>
                            <span>Черга ${q}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px">
                            <span style="font-size:11px; color:#ffd54f">${info[q].time}</span>
                            <span class="eye-btn" onclick="toggleQ('${q}')">${active?'👁️':'🙈'}</span>
                        </div>
                    </div>`;
            });
            document.getElementById('queues-list').innerHTML = html;
        }

        function toggleQ(q) {
            if (activeQueues.has(q)) activeQueues.delete(q);
            else activeQueues.add(q);
            refreshMap();
            loadPoints(); // Перемальовуємо список
        }

        function refreshMap() {
            Object.keys(layers).forEach(q => {
                if (activeQueues.has(q)) layers[q].addTo(map);
                else map.removeLayer(layers[q]);
            });
        }

        loadPoints();
        setInterval(loadPoints, 30000);
    </script>
</body>
</html>
